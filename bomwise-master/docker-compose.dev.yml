services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bomexplorer
      POSTGRES_PASSWORD: bomexplorer
      POSTGRES_DB: bomexplorer
    ports:
      - "5432:5432"
    volumes:
      - bomexplorer_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bomexplorer_postgres_data:
