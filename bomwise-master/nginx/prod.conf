upstream bomwise_backend {
    server localhost:8000;
}

upstream bomwise_frontend {
    server localhost:3000;
}

# Redirect HTTP to HTTPS (optional, Cloudflare handles this too)
server {
    listen 80;
    server_name app.bomexplorer.app;

    location / {
        return 301 https://$host$request_uri;
    }

    # Cloudflare needs this to verify domain
    location /.well-known/ {
        root /var/www/html;
    }
}

# HTTPS - reverse proxy to frontend and backend
server {
    listen 443 ssl http2;
    server_name app.bomexplorer.app;

    # SSL - Cloudflare Origin CA certs (or flexible SSL)
    ssl_certificate     /etc/ssl/certs/bomexplorer.pem;
    ssl_certificate_key /etc/ssl/private/bomexplorer.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend (static files from Docker)
    location / {
        proxy_pass http://bomwise_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (trailing slash on proxy_pass strips /api prefix automatically)
    location /api/ {
        proxy_pass http://bomwise_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://bomwise_backend/health;
        proxy_set_header Host $host;
    }
}